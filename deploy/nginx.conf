server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The client only ever talks to the platform (main server), never to WALRUS.
  location /api/ {
    proxy_pass http://platform:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
